# Rejoint le réseau partagé avec les autres repos (créé une seule fois : docker network create web)
services:
  hub-web:
    build: .
    env_file: .env
    ports:
      - "5002:8000"   # 5000 = auth, 5001 = hub-app, 5002 = hub-web (test en local)
    networks: [web]
    restart: unless-stopped

networks:
  web:
    external: true
