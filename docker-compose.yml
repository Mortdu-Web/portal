# Rejoint le réseau partagé avec les autres repos (créé une seule fois : docker network create web)
services:
  hub-web:
    build: .
    env_file: .env
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-25002}:8000"
    networks: [web]
    restart: unless-stopped

networks:
  web:
    external: true
